<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tenth Tone">
  <!-- Purple rounded square -->
  <rect x="2" y="2" width="116" height="116" rx="27" fill="#7B3FB3"/>
  <!-- Cyan accent stripes on the left -->
  <rect x="24" y="30" width="4.5" height="60" rx="2.25" fill="#16C5D6"/>
  <rect x="32" y="30" width="3" height="60" rx="1.5" fill="#46DCE8"/>
