<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tenth Tone">
  <rect x="2" y="2" width="116" height="116" rx="27" fill="#7B3FB3"/>
  <!-- cyan accent stripes -->
  <rect x="25" y="27" width="5" height="66" rx="2.5" fill="#19D3E0"/>
  <rect x="33.5" y="27" width="3" height="66" rx="1.5" fill="#5BE7EF"/>
  <!-- white brushy double-T -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- top crossbar (stacked strokes for a brushed look) -->
    <path d="M42 40 q24 -3 48 1" stroke-width="6.5"/>
    <path d="M45 46 q21 -2 41 2" stroke-width="3" opacity="0.9"/>
    <!-- lower offset crossbar -->
    <path d="M43 53 q14 -2 28 1" stroke-width="4.5"/>
    <!-- left stem -->
    <path d="M59 41 q-2 23 -3 46" stroke-width="6.5"/>
    <path d="M62.5 44 q-1.5 20 -2.5 40" stroke-width="2.4" opacity="0.85"/>
    <!-- right stem -->
    <path d="M77 47 q-2 19 -4 38" stroke-width="6"/>
    <path d="M80.5 50 q-1.5 17 -3 33" stroke-width="2.4" opacity="0.85"/>
  </g>
  <!-- dry-brush streaks (purple gaps over the white) -->
  <g stroke="#7B3FB3" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M48 41 q20 -2 36 1" stroke-width="0.9"/>
    <path d="M60 50 l-1.5 34" stroke-width="0.9"/>
    <path d="M78 54 l-2.5 30" stroke-width="0.9"/>
  </g>
</svg>
