    <!-- right stem -->
    <path d="M76 45c2.4-.3 5.6.4 5.6 3.3-.2 12-1 26-2 38-.3 3.4-7 3-6.8-.4.8-12 1.4-25 1.8-37.6.1-1.8.8-3.1 1.4-3.3z"/>
  </g>
</svg>
