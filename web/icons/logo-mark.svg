  <g fill="#FFFFFF">
    <!-- upper horizontal stroke -->
    <path d="M41 41c10-2 34-3 52-1 3 .3 3 6 0 6-18 1-42 1-52 2-3 .3-3-6.6 0-7z"/>
    <!-- lower horizontal stroke -->
